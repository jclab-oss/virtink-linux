# Tiny Cloud configuration for virtink VMs
# /etc/tiny-cloud.conf, sourced as a shell script by tiny-cloud

# virtink provides cloud-init data with cloudInit volumes, which are NoCloud
# data sources.
CLOUD=nocloud
TINY_CLOUD_INIT_SYSTEM=openrc

# virtink creates the filesystem of an imageRootfs volume at its full size.
SKIP_INIT_ACTIONS="expand_root"

# Called once tiny-cloud has loaded its functions and set up its actions.
finalize_init_actions() {
	# tiny-cloud 3.4.1 checks the hostname with "imds -e", which succeeds even
	# without meta-data "hostname", so it never falls back to "local-hostname",
	# which is the only one virtink provides.
	init_needs__set_hostname() {
		[ -n "$(imds @hostname 2>/dev/null || imds @local-hostname 2>/dev/null)" ]
	}

	# tiny-cloud supports only a subset of cloud-config, which lacks the
	# top-level password and ssh_pwauth that virtink examples use, so they're
	# added here. Like chpasswd with expire: false, the password never expires.
	if [ "$USERDATA_TYPE" = cloud-config ]; then
		INIT_ACTIONS_MAIN="$(insert_after create_default_user "virtink_password virtink_ssh_pwauth" $INIT_ACTIONS_MAIN)"
	fi
}

init_needs__virtink_password() {
	[ "$CLOUD_USER" != none ] && [ -n "$CLOUD_USER" ] &&
	[ -n "$(yx -f "$TINY_CLOUD_VAR/user-data" password 2>/dev/null)" ]
}

init__virtink_password() {
	printf '%s:%s\n' "$CLOUD_USER" "$(yx -f "$TINY_CLOUD_VAR/user-data" password)" | chpasswd
}

init_needs__virtink_ssh_pwauth() {
	[ -n "$(yx -f "$TINY_CLOUD_VAR/user-data" ssh_pwauth 2>/dev/null)" ]
}

init__virtink_ssh_pwauth() {
	local value
	case "$(yx -f "$TINY_CLOUD_VAR/user-data" ssh_pwauth)" in
		[Tt]rue|[Yy]es) value=yes ;;
		*) value=no ;;
	esac
	echo "PasswordAuthentication $value" > "$ETC/ssh/sshd_config.d/50-virtink-ssh-pwauth.conf"
}
