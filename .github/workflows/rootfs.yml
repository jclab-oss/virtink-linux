name: rootfs

# Builds rootfs/<distro>/<series> for a tag rootfs/<distro>/<version>[-r<revision>],
# such as rootfs/alpine/3.24.2, and publishes it as the image
# <repo>-rootfs-<distro>. The version is passed to the Dockerfile as the build
# argument VERSION.
on:
  push:
    tags:
      - rootfs/*/*

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: .github/scripts/parse-tag.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      # ghcr.io requires lowercase repository names
      - id: image
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          TAGS: ${{ steps.tag.outputs.tags }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-$IMAGE"
          {
            echo "tags<<EOF"
            for tag in $TAGS; do
              echo "$image:$tag"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ steps.tag.outputs.dir }}
          build-args: VERSION=${{ steps.tag.outputs.version }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          annotations: index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
