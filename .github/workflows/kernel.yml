name: kernel

# Builds kernel/<series> for a tag kernel/<version>[-r<revision>], such as
# kernel/6.18.54, and publishes it as the image <repo>-kernel and as a GitHub
# release with the vmlinux of each architecture.
on:
  push:
    tags:
      - kernel/*

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.tag.outputs.dir }}
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      image: ${{ steps.image.outputs.image }}
      tags: ${{ steps.tag.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: .github/scripts/parse-tag.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      # ghcr.io requires lowercase repository names
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ steps.tag.outputs.image }}" >> "$GITHUB_OUTPUT"

  # Each architecture is cross-compiled in a job of its own, so they build in
  # parallel, and the merge job combines their images.
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: x86_64
          - platform: linux/arm64
            arch: aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: kernel
          build-args: KERNEL_VERSION=${{ needs.prepare.outputs.version }}
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      # The kernel is already built, so this only exports it from the cache.
      - uses: docker/build-push-action@v7
        with:
          context: kernel
          build-args: KERNEL_VERSION=${{ needs.prepare.outputs.version }}
          platforms: ${{ matrix.platform }}
          target: artifacts
          outputs: type=local,dest=out

      - run: |
          mkdir release
          cp out/vmlinux release/vmlinux-${{ matrix.arch }}
          cp out/config release/config-${{ matrix.arch }}
          echo "${{ steps.build.outputs.digest }}" > release/digest-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: kernel-*
          path: release
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          args=(--annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY")
          for tag in $TAGS; do
            args+=(-t "$IMAGE:$tag")
          done
          for digest in release/digest-*; do
            args+=("$IMAGE@$(cat "$digest")")
          done
          docker buildx imagetools create "${args[@]}"
          rm release/digest-*

      - uses: softprops/action-gh-release@v3
        with:
          body: |
            Linux ${{ needs.prepare.outputs.version }} for virtink, built from `${{ needs.prepare.outputs.dir }}`.

            ```yaml
            kernel:
              image: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}
              cmdline: "console=ttyS0 root=/dev/vda rw" # console=ttyAMA0 on arm64
            ```
          files: release/*
